name: tests

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - if: matrix.python-version == '3.12'
        run: python -m pip install --require-hashes -r requirements-figures-linux-py312.lock.txt
      - run: python -m pip install -e ".[test,lint,figures]"
      - run: python -m pytest -q
      # Legacy research scripts are intentionally outside this first release
      # gate; lint only the release/audit tooling until the complete training
      # and post-processing closure is made portable.
      - run: >-
          ruff check
          scripts/check_release_boundary.py
          scripts/build_v211_release_manifest.py
          scripts/build_v211_external_source_registry.py
          scripts/stage_v211_renderer_snapshot.py
          scripts/stage_v211_model_contract.py
          scripts/check_wheel_contents.py
          tests/test_release_boundary.py
          tests/test_dependency_locks.py
          tests/test_staging_manifest_contract.py
          tests/test_wheel_contents.py
      - run: python scripts/check_release_boundary.py
      - run: python scripts/build_v211_release_manifest.py --check
      - run: python scripts/build_v211_external_source_registry.py --check
      - run: python -m pip wheel --no-deps --wheel-dir dist-ci .
      - run: python scripts/check_wheel_contents.py dist-ci
